<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odraz! — hra pro dva</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;display:grid;place-items:center;background:#080d1c;color:#eef4ff;font:16px system-ui,sans-serif}.wrap{width:100vw;height:100vh;text-align:center}h1{margin:8px;color:#64f2c2;letter-spacing:.12em;font-size:clamp(26px,4vw,42px)}.sub,.help{color:#9fb0cb}.menu{display:flex;gap:12px;justify-content:center;margin:22px}#menu{position:fixed;z-index:4;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080d1ceF;padding:24px}.menu button,.hud button{background:#64f2c2;color:#06151a;border:0;padding:12px 24px;border-radius:24px;font-size:17px;font-weight:800;cursor:pointer}.menu button:nth-child(2){background:#69a8ff}.hud{display:none;justify-content:space-between;align-items:center;max-width:none;margin:0;color:#c7d4ec;position:fixed;z-index:3;left:2vw;right:2vw;top:12px}.hud b{color:#64f2c2}canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;max-height:none;background:#101a31;border:0;border-radius:0;box-shadow:0 18px 70px #0009;touch-action:none}.help{font-size:14px;margin:12px;position:fixed;z-index:3;bottom:4px;left:0;right:0;text-shadow:0 1px 4px #000}.legend{display:none;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px auto;color:#d8e3f5;font-size:13px}.legend span{background:#17243c;border:1px solid #30466b;border-radius:18px;padding:6px 10px}.legend i{font-style:normal;font-size:16px;margin-right:4px}#game{display:none}
</style><body><main class="wrap"><h1>ODRAZ!</h1><p class="sub">Rozbijte všechny barevné čtverečky!</p><section id="menu"><p>Vyber si režim:</p><div class="menu"><button id="solo">SOLO</button></div></section><div class="hud" id="hud"><span>REŽIM <b id="modeLabel"></b></span><span>LEVEL <b id="level">1</b></span><span>BODY <b id="score">0</b></span><span>ŽIVOTY <b id="lives">3</b></span><button id="restart">Nová hra</button></div><canvas id="game" width="900" height="560"></canvas><div class="legend" id="legend"><span><i>🐢</i> zpomalení</span><span><i>⚡</i> zrychlení</span><span><i>❤️</i> život navíc</span><span><i>●●</i> více míčků</span><span><i>🔵</i> větší míček</span></div><p class="help" id="help"></p></main><script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),menu=document.querySelector('#menu'),hud=document.querySelector('#hud'),help=document.querySelector('#help'),legend=document.querySelector('#legend');let paddle,ball,bricks,score,lives,brokenCount,level,started,over,mode='solo',paused=false,slowUntil=0,fastUntil=0,mouseX=450,particles=[],powerups=[],bonusBalls=[],bigUntil=0,audio;const colors=['#ff6482','#ffb454','#ffe66d','#64f2c2','#69a8ff'];
function sound(freq=440,duration=.07,type='sine'){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function fasterBall(b){const v=Math.hypot(b.vx,b.vy),n=Math.min(15,v*1.05);if(v){b.vx*=n/v;b.vy*=n/v}}function faster(){const v=Math.hypot(ball.vx,ball.vy),n=Math.min(15,v*1.05);if(v){ball.vx*=n/v;ball.vy*=n/v}for(const q of bonusBalls){const z=Math.hypot(q.vx,q.vy);if(z){q.vx*=n/z;q.vy*=n/z}}}function syncSpeeds(){const v=Math.hypot(ball.vx,ball.vy);for(const q of bonusBalls){const z=Math.hypot(q.vx,q.vy);if(z){q.vx*=v/z;q.vy*=v/z}}}
function buildLevel(){bricks=[];const rows=Math.min(8+level-1,12),cols=Math.min(10+level-1,12),gap=8,bw=Math.min(68,(820-(cols-1)*gap)/cols),startX=(900-(cols*bw+(cols-1)*gap))/2,center=(cols-1)/2;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){const pattern=level%4;let keep=true;if(pattern===1)keep=Math.abs(col-center)<=1.2+(3.5-Math.abs(r-(rows-1)/2))*.9;if(pattern===2)keep=Math.abs(col-center)<=(r+1)*.72;if(pattern===3)keep=(r+col)%2===0||r===0;if(!keep)continue;const shapes=['round','diamond','hex','circle','triangle'];bricks.push({x:startX+col*(bw+gap),y:55+r*35,w:bw,h:22,color:colors[(r+level-1)%colors.length],shape:shapes[(r+col+level-1)%shapes.length],bomb:Math.random()<.125,alive:true})}if(bricks.length&&!bricks.some(b=>b.bomb))bricks[Math.floor(Math.random()*bricks.length)].bomb=true}function newGame(m=mode){mode=m;paddle={x:390,y:520,w:120,h:13};ball={x:450,y:500,r:12,vx:0,vy:-9};powerups=[];bonusBalls=[];bigUntil=0;slowUntil=0;fastUntil=0;level=1;buildLevel();score=0;lives=3;brokenCount=0;started=false;over=false;paused=false;particles=[];menu.style.display='none';hud.style.display='flex';c.style.display='block';legend.style.display='flex';document.querySelector('#modeLabel').textContent='SOLO';help.innerHTML='Pohybuj myší nebo kolečkem a ovládej tyčku. Kliknutím vypustíš míček. Chyť schopnost tyčkou a hned se aktivuje.';document.querySelector('#level').textContent=level;hud.querySelector('#score').textContent=score;hud.querySelector('#lives').textContent=lives;draw()}
function aim(x){let r=c.getBoundingClientRect();mouseX=(x-r.left)*c.width/r.width;paddle.x=Math.max(10,Math.min(900-paddle.w-10,mouseX-paddle.w/2));if(!started&&!over){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}}
c.addEventListener('mousemove',e=>aim(e.clientX));c.addEventListener('touchmove',e=>{e.preventDefault();aim(e.touches[0].clientX)},{passive:false});c.addEventListener('wheel',e=>{e.preventDefault();aim(c.getBoundingClientRect().left+c.getBoundingClientRect().width/2+e.deltaY*1.5)},{passive:false});c.addEventListener('click',()=>{if(over)newGame(mode);started=true});document.addEventListener('keydown',e=>{if(e.code==='Space'&&menu.style.display==='none'&&!over){e.preventDefault();paused=!paused}});document.querySelector('#solo').onclick=()=>newGame('solo');document.querySelector('#restart').onclick=()=>{menu.style.display='block';hud.style.display='none';c.style.display='none';legend.style.display='none'};
function burst(b){if(Math.random()<.1){const t=[['slow','🐢','#69a8ff'],['fast','⚡','#ff6482'],['life','♥','#64f2c2'],['multi','●●','#ffe66d'],['big','🔵','#d58bff']][Math.floor(Math.random()*5)];powerups.push({x:b.x+b.w/2,y:b.y+b.h/2,type:t[0],symbol:t[1],color:t[2]})}for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color:b.color})}}
function breakBrick(b,blast=true){if(!b.alive)return;b.alive=false;score+=10;burst(b);sound(b.bomb?95:220,b.bomb?.24:.1,b.bomb?'sawtooth':'square');if(b.bomb&&blast){const x=b.x+b.w/2,y=b.y+b.h/2;for(const n of bricks){if(n.alive&&Math.hypot(n.x+n.w/2-x,n.y+n.h/2-y)<145)breakBrick(n,false)}}document.querySelector('#score').textContent=score}function draw(){ctx.clearRect(0,0,900,560);ctx.fillStyle='#101a31';ctx.fillRect(0,0,900,560);ctx.strokeStyle='#233453';for(let y=20;y<560;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}for(const b of bricks)if(b.alive){ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.fillStyle=b.bomb?'#fa4f68':b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();if(b.bomb){ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('💣',b.x+b.w/2,b.y+b.h-4)}ctx.shadowBlur=0}ctx.fillStyle='#64f2c2';ctx.shadowColor='#64f2c2';ctx.shadowBlur=16;ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();ctx.fillStyle='#fff';ctx.shadowColor='#d9f5ff';ctx.shadowBlur=13;for(const q of [ball,...bonusBalls]){ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;for(const p of powerups){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#08101d';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(p.symbol,p.x,p.y+5)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}}
function tick(){if(started&&!over&&!paused){if(bigUntil&&Date.now()>bigUntil){ball.r=12;for(const q of bonusBalls)q.r=12;bigUntil=0}if(slowUntil&&Date.now()>slowUntil){ball.vx/=.65;ball.vy/=.65;for(const q of bonusBalls){q.vx/=.65;q.vy/=.65}slowUntil=0}if(fastUntil&&Date.now()>fastUntil){ball.vx/=1.4;ball.vy/=1.4;for(const q of bonusBalls){q.vx/=1.4;q.vy/=1.4}fastUntil=0}for(let qi=bonusBalls.length-1;qi>=0;qi--){const q=bonusBalls[qi];q.x+=q.vx;q.y+=q.vy;if(q.x<q.r||q.x>900-q.r)q.vx*=-1;if(q.y<q.r)q.vy=Math.abs(q.vy);if(q.vy>0&&q.y+q.r>=paddle.y&&q.x>=paddle.x&&q.x<=paddle.x+paddle.w){q.vy=-Math.abs(q.vy);sound(520,.07,'triangle')}for(const b of bricks)if(b.alive&&q.x+q.r>b.x&&q.x-q.r<b.x+b.w&&q.y+q.r>b.y&&q.y-q.r<b.y+b.h){breakBrick(b);q.vy*=-1;break}if(q.y>570)bonusBalls.splice(qi,1)}ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>900-ball.r){ball.vx*=-1;sound(330,.05)}if(ball.y<ball.r){ball.vy=Math.abs(ball.vy);sound(370,.05)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y<paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);let speed=Math.hypot(ball.vx,ball.vy);ball.vx=hit*speed*.9;ball.vy=-Math.sqrt(Math.max(8,speed*speed-ball.vx*ball.vx));sound(520,.07,'triangle')}for(const b of bricks)if(b.alive&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){breakBrick(b);ball.vy*=-1;break}if(ball.y>570){if(bonusBalls.length){ball=bonusBalls.pop()}else{lives--;sound(120,.25,'sawtooth');document.querySelector('#lives').textContent=lives;if(!lives){over=true;started=false}else{started=false;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=0;ball.vy=-9;bigUntil=0;slowUntil=0;fastUntil=0}}}if(bricks.every(b=>!b.alive)){if(level>=20){over=true;started=false;sound(1100,.5,'triangle')}else{level++;buildLevel();document.querySelector('#level').textContent=level;bonusBalls=[];powerups=[];bigUntil=0;slowUntil=0;fastUntil=0;ball={x:paddle.x+paddle.w/2,y:paddle.y-14,r:12,vx:0,vy:-9};started=false;sound(900,.35,'triangle')}}}for(let i=powerups.length-1;i>=0;i--){let p=powerups[i];p.y+=2.2;if(p.y+11>=paddle.y&&p.y-11<=paddle.y+paddle.h&&p.x>=paddle.x&&p.x<=paddle.x+paddle.w){powerups.splice(i,1);if(p.type==='slow'){ball.vx*=.65;ball.vy*=.65;for(const q of bonusBalls){q.vx*=.65;q.vy*=.65}slowUntil=Date.now()+10000;sound(300,.2)}if(p.type==='fast'){ball.vx*=1.4;ball.vy*=1.4;for(const q of bonusBalls){q.vx*=1.4;q.vy*=1.4}fastUntil=Date.now()+10000;sound(760,.15,'triangle')}if(p.type==='life'){lives++;document.querySelector('#lives').textContent=lives;sound(880,.25)}if(p.type==='big'){ball.r=18;for(const q of bonusBalls)q.r=18;bigUntil=Date.now()+10000;sound(740,.22,'sine')}if(p.type==='multi'){const current=[ball,...bonusBalls],added=[];for(const q of current){added.push({x:q.x,y:q.y,r:q.r,vx:-q.vx,vy:q.vy},{x:q.x,y:q.y,r:q.r,vx:q.vx,vy:-q.vy})}bonusBalls.push(...added);sound(660,.2,'triangle')}}if(p.y>570)powerups.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;if(!--p.life)particles.splice(i,1)}syncSpeeds();draw();if(over){ctx.fillStyle='#07101ddd';ctx.fillRect(0,0,900,560);ctx.textAlign='center';ctx.fillStyle='#64f2c2';ctx.font='bold 42px system-ui';ctx.fillText(lives?'VYHRÁLI JSTE!':'KONEC HRY',450,260);ctx.fillStyle='white';ctx.font='20px system-ui';ctx.fillText('Kliknutím začnete znovu',450,300)}else if(paused){ctx.fillStyle='#07101ddd';ctx.fillRect(0,0,900,560);ctx.textAlign='center';ctx.fillStyle='#64f2c2';ctx.font='bold 42px system-ui';ctx.fillText('PAUZA',450,270);ctx.fillStyle='white';ctx.font='20px system-ui';ctx.fillText('Mezerníkem pokračuješ',450,310)}else if(!started){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='17px system-ui';ctx.fillText('KLIKNUTÍM VYPUSTÍTE MÍČEK',450,465)}requestAnimationFrame(tick)}newGame('solo');menu.style.display='block';hud.style.display='none';c.style.display='none';legend.style.display='none';tick()})();
</script></body></html>
