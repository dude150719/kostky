<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Odraz! — arkádová hra</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d1c;color:#eef4ff;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(960px,96vw);text-align:center}h1{margin:8px 0;color:#64f2c2;letter-spacing:.12em;font-size:clamp(24px,4vw,40px)}.sub{color:#9fb0cb;margin:0 0 12px}.hud{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto 10px;color:#c7d4ec}.hud b{color:#64f2c2}canvas{display:block;width:100%;height:auto;max-height:72vh;background:#101a31;border:1px solid #30466b;border-radius:14px;box-shadow:0 18px 70px #0009;touch-action:none}.controls{color:#9fb0cb;font-size:14px;margin:12px}.controls strong{color:white}button{background:#64f2c2;color:#06151a;border:0;padding:9px 18px;border-radius:20px;font-weight:800;cursor:pointer}
</style></head><body><main class="wrap"><h1>ODRAZ!</h1><p class="sub">Rozbij všechny barevné čtverečky.</p><div class="hud"><span>BODY <b id="score">0</b></span><span>ŽIVOTY <b id="lives">3</b></span><button id="restart">Nová hra</button></div><canvas id="game" width="900" height="560" aria-label="Herní plocha"></canvas><p class="controls"><strong>Ovládání:</strong> pohybuj myší nebo kolečkem pro nastavení tyčky. Kliknutím vypustíš míček.</p></main>
<script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives');let paddle,ball,bricks,score,lives,started,over,mouseX=450;const colors=['#ff6482','#ffb454','#ffe66d','#64f2c2','#69a8ff'];
function reset(){paddle={x:390,y:520,w:120,h:13};ball={x:450,y:500,r:9,vx:3.3,vy:-4.1};bricks=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:48+col*82,y:55+r*35,w:68,h:22,color:colors[r],alive:true});score=0;lives=3;started=false;over=false;updateHud();draw()}
function updateHud(){scoreEl.textContent=score;livesEl.textContent='♥ '.repeat(lives).trim()||'0'}
function aim(x){const rect=c.getBoundingClientRect();mouseX=(x-rect.left)*c.width/rect.width;paddle.x=Math.max(10,Math.min(c.width-paddle.w-10,mouseX-paddle.w/2));if(!started&&!over){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}}
c.addEventListener('mousemove',e=>aim(e.clientX));c.addEventListener('touchmove',e=>{e.preventDefault();aim(e.touches[0].clientX)},{passive:false});c.addEventListener('wheel',e=>{e.preventDefault();aim(c.getBoundingClientRect().left+c.getBoundingClientRect().width/2+e.deltaY*1.5)},{passive:false});c.addEventListener('click',()=>{if(over)reset();started=true});document.querySelector('#restart').onclick=reset;
function burst(b){for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color:b.color})}}let particles=[];
function draw(){ctx.clearRect(0,0,900,560);ctx.fillStyle='#101a31';ctx.fillRect(0,0,900,560);ctx.strokeStyle='#233453';ctx.lineWidth=1;for(let y=20;y<560;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}for(const b of bricks)if(b.alive){ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.shadowBlur=0}ctx.fillStyle='#64f2c2';ctx.shadowColor='#64f2c2';ctx.shadowBlur=16;ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}}
function tick(){if(started&&!over){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>900-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y<paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);const speed=Math.min(12,Math.hypot(ball.vx,ball.vy)*1.08);ball.vx=hit*speed;ball.vy=-Math.sqrt(Math.max(8,speed*speed-ball.vx*ball.vx))}for(const b of bricks)if(b.alive&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false;ball.vy*=-1;score+=10;burst(b);updateHud();break}if(ball.y>570){lives--;updateHud();if(!lives){over=true;started=false}else{started=false;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=3.3;ball.vy=-4.1}}if(bricks.every(b=>!b.alive)){over=true;started=false}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(!p.life)particles.splice(i,1)}draw();if(over){ctx.fillStyle='#07101ddd';ctx.fillRect(0,0,900,560);ctx.textAlign='center';ctx.fillStyle='#64f2c2';ctx.font='bold 42px system-ui';ctx.fillText(lives?'VYHRÁL JSI!':'KONEC HRY',450,260);ctx.fillStyle='white';ctx.font='20px system-ui';ctx.fillText('Klikni nebo zvol Nová hra',450,300)}else if(!started){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='17px system-ui';ctx.fillText('KLIKNUTÍM VYPUSTÍŠ MÍČEK',450,465)}requestAnimationFrame(tick)}reset();tick()})();
</script></body></html>
