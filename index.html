<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odraz! — hra pro dva</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080d1c;color:#eef4ff;font:16px system-ui,sans-serif}.wrap{width:min(960px,96vw);text-align:center}h1{margin:8px;color:#64f2c2;letter-spacing:.12em;font-size:clamp(26px,4vw,42px)}.sub,.help{color:#9fb0cb}.menu{display:flex;gap:12px;justify-content:center;margin:22px}.menu button,.hud button{background:#64f2c2;color:#06151a;border:0;padding:12px 24px;border-radius:24px;font-size:17px;font-weight:800;cursor:pointer}.menu button:nth-child(2){background:#69a8ff}.hud{display:none;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto 10px;color:#c7d4ec}.hud b{color:#64f2c2}canvas{display:block;width:100%;height:auto;max-height:72vh;background:#101a31;border:1px solid #30466b;border-radius:14px;box-shadow:0 18px 70px #0009;touch-action:none}.help{font-size:14px;margin:12px}#game{display:none}
</style><body><main class="wrap"><h1>ODRAZ!</h1><p class="sub">Rozbijte všechny barevné čtverečky!</p><section id="menu"><p>Vyber si režim:</p><div class="menu"><button id="solo">SOLO</button><button id="team">TÝM — 2 hráči</button></div><p class="sub">V týmovém režimu ovládáte společně jednu tyčku a jeden míček.</p></section><div class="hud" id="hud"><span>REŽIM <b id="modeLabel"></b></span><span>BODY <b id="score">0</b></span><span>ŽIVOTY <b id="lives">3</b></span><button id="restart">Nová hra</button></div><canvas id="game" width="900" height="560"></canvas><p class="help" id="help"></p></main><script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),menu=document.querySelector('#menu'),hud=document.querySelector('#hud'),help=document.querySelector('#help');let paddle,ball,bricks,score,lives,started,over,mode='solo',mouseX=450,particles=[];const colors=['#ff6482','#ffb454','#ffe66d','#64f2c2','#69a8ff'];
function newGame(m=mode){mode=m;paddle={x:390,y:520,w:120,h:13};ball={x:450,y:500,r:9,vx:3.3,vy:-4.1};bricks=[];for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:48+col*82,y:55+r*35,w:68,h:22,color:colors[r],alive:true});score=0;lives=3;started=false;over=false;particles=[];menu.style.display='none';hud.style.display='flex';c.style.display='block';document.querySelector('#modeLabel').textContent=mode==='team'?'TÝM':'SOLO';help.innerHTML=mode==='team'?'<b>Hráč 1:</b> myš • <b>Hráč 2:</b> kolečko myši — držte tyčku společně. Kliknutím vypustíte míček.':'Pohybuj myší nebo kolečkem a ovládej tyčku. Kliknutím vypustíš míček.';hud.querySelector('#score').textContent=score;hud.querySelector('#lives').textContent=lives;draw()}
function aim(x){let r=c.getBoundingClientRect();mouseX=(x-r.left)*c.width/r.width;paddle.x=Math.max(10,Math.min(900-paddle.w-10,mouseX-paddle.w/2));if(!started&&!over){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}}
c.addEventListener('mousemove',e=>aim(e.clientX));c.addEventListener('touchmove',e=>{e.preventDefault();aim(e.touches[0].clientX)},{passive:false});c.addEventListener('wheel',e=>{e.preventDefault();aim(c.getBoundingClientRect().left+c.getBoundingClientRect().width/2+e.deltaY*1.5)},{passive:false});c.addEventListener('click',()=>{if(over)newGame(mode);started=true});document.querySelector('#solo').onclick=()=>newGame('solo');document.querySelector('#team').onclick=()=>newGame('team');document.querySelector('#restart').onclick=()=>{menu.style.display='block';hud.style.display='none';c.style.display='none'};
function burst(b){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*3;particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color:b.color})}}
function draw(){ctx.clearRect(0,0,900,560);ctx.fillStyle='#101a31';ctx.fillRect(0,0,900,560);ctx.strokeStyle='#233453';for(let y=20;y<560;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}for(const b of bricks)if(b.alive){ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.fillStyle=b.color;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,5);ctx.fill();ctx.shadowBlur=0}ctx.fillStyle='#64f2c2';ctx.shadowColor='#64f2c2';ctx.shadowBlur=16;ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}}
function tick(){if(started&&!over){ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>900-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y<paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2),speed=Math.min(12,Math.hypot(ball.vx,ball.vy)*1.08);ball.vx=hit*speed;ball.vy=-Math.sqrt(Math.max(8,speed*speed-ball.vx*ball.vx))}for(const b of bricks)if(b.alive&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.alive=false;ball.vy*=-1;score+=10;burst(b);document.querySelector('#score').textContent=score;break}if(ball.y>570){lives--;document.querySelector('#lives').textContent=lives;if(!lives){over=true;started=false}else{started=false;ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=3.3;ball.vy=-4.1}}if(bricks.every(b=>!b.alive)){over=true;started=false}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;if(!--p.life)particles.splice(i,1)}draw();if(over){ctx.fillStyle='#07101ddd';ctx.fillRect(0,0,900,560);ctx.textAlign='center';ctx.fillStyle='#64f2c2';ctx.font='bold 42px system-ui';ctx.fillText(lives?'VYHRÁLI JSTE!':'KONEC HRY',450,260);ctx.fillStyle='white';ctx.font='20px system-ui';ctx.fillText('Kliknutím začnete znovu',450,300)}else if(!started){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='17px system-ui';ctx.fillText('KLIKNUTÍM VYPUSTÍTE MÍČEK',450,465)}requestAnimationFrame(tick)}tick()})();
</script></body></html>
